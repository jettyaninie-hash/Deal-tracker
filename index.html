<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deal Tracker - 调试版</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #f0f4f8; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; }
        .auth-card { max-width: 400px; margin: 40px auto; }
        .auth-card input { width: 100%; padding: 10px; margin: 8px 0 16px; border: 2px solid #e2e8f0; border-radius: 8px; }
        .auth-card button { width: 100%; padding: 12px; background: #2b6cb0; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .auth-card .btn-secondary { background: transparent; color: #2b6cb0; border: 2px solid #2b6cb0; margin-top: 8px; }
        .auth-card .btn-secondary:hover { background: #ebf8ff; }
        .auth-card .error { color: red; font-size: 14px; margin-bottom: 12px; }
        .auth-card .success { color: green; font-size: 14px; margin-bottom: 12px; }
        .hidden { display: none !important; }
        #appMain .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
        .btn { padding: 8px 20px; border: none; border-radius: 30px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: #f6ad55; color: #1a202c; }
        .btn-danger { background: #fc8181; color: white; }
        .btn-outline { background: transparent; border: 2px solid #2b6cb0; color: #2b6cb0; }
        .btn-sm { padding: 4px 12px; font-size: 12px; }
        .project-item { display: flex; justify-content: space-between; padding: 12px; background: #f7fafc; border-radius: 8px; margin-bottom: 8px; border-left: 4px solid #2b6cb0; cursor: pointer; }
        .project-item .status { font-size: 13px; padding: 2px 12px; border-radius: 20px; background: #e2e8f0; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: white; border-radius: 20px; max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 32px; }
        .modal .close-btn { float: right; background: none; border: none; font-size: 28px; cursor: pointer; }
        .modal .form-group { margin-bottom: 16px; }
        .modal .form-group label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
        .modal .form-group input, .modal .form-group select { width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 8px; }
        .modal .form-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; padding-top: 16px; border-top: 1px solid #edf2f7; }
    </style>
</head>
<body>
<div class="container">

    <!-- 认证卡片 -->
    <div id="authCard" class="card auth-card">
        <h2 style="text-align:center; margin-bottom:20px;">🔐 登录 / 注册</h2>
        <div id="authError" class="error"></div>
        <div id="authSuccess" class="success"></div>
        <input type="email" id="emailInput" placeholder="邮箱地址" required>
        <input type="password" id="passwordInput" placeholder="密码 (至少6位)" required>
        <button id="loginBtn">登录</button>
        <button id="registerBtn" class="btn-secondary">注册新账号</button>
        <p style="text-align:center; font-size:13px; color:#718096; margin-top:12px;">
            💡 注册后会自动登录（需关闭邮箱验证）
        </p>
    </div>

    <!-- 主界面 -->
    <div id="appMain" class="hidden">
        <div class="header">
            <h1>📊 Deal Tracker</h1>
            <div>
                <span id="userEmailDisplay" style="font-weight:500;"></span>
                <button id="logoutBtn" class="btn btn-danger btn-sm">登出</button>
            </div>
        </div>
        <div style="display:flex; flex-wrap:wrap; gap:16px; margin-bottom:20px;">
            <div class="card" style="flex:1; text-align:center;"><span>总项目</span><br><strong id="totalCount">0</strong></div>
            <div class="card" style="flex:1; text-align:center;"><span>📢 营销中</span><br><strong id="marketingCount">0</strong></div>
            <div class="card" style="flex:1; text-align:center;"><span>📌 委任中</span><br><strong id="mandatedCount">0</strong></div>
            <div class="card" style="flex:1; text-align:center;"><span>✅ 已完成</span><br><strong id="completedCount">0</strong></div>
        </div>
        <div style="display:flex; flex-wrap:wrap; gap:12px; margin-bottom:16px;">
            <button class="btn btn-primary" onclick="openAddModal()">＋ 新增项目</button>
            <button class="btn btn-outline btn-sm" onclick="exportData()">📤 导出</button>
            <button class="btn btn-outline btn-sm" onclick="document.getElementById('importFile').click()">📥 导入</button>
            <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importData(event)">
            <input type="text" id="searchInput" placeholder="🔍 搜索..." style="flex:1; padding:8px; border:2px solid #e2e8f0; border-radius:30px;" oninput="renderProjects()">
        </div>
        <div class="card" id="projectsContainer"></div>
    </div>

    <!-- 模态框：新增/编辑 -->
    <div id="projectModal" class="modal-overlay">
        <div class="modal">
            <button class="close-btn" onclick="closeModal('projectModal')">&times;</button>
            <h2 id="modalTitle">新增项目</h2>
            <form id="projectForm" onsubmit="saveProject(event)">
                <input type="hidden" id="editId">
                <div class="form-group"><label>状态</label><select id="fStatus"><option value="marketing">营销中</option><option value="mandated">委任中</option><option value="completed">已完成</option></select></div>
                <div class="form-group"><label>发行人名称 *</label><input type="text" id="fIssuerName" required></div>
                <div class="form-group"><label>行业</label><select id="fIndustry"><option value="其他">其他</option><option value="房地产">房地产</option><option value="建筑">建筑</option><option value="能源">能源</option><option value="金融">金融</option><option value="科技">科技</option><option value="制造">制造</option><option value="消费">消费</option><option value="医疗">医疗</option></select></div>
                <div class="form-group"><label>外部评级</label><input type="text" id="fExternalRating" placeholder="AAA/AA+"></div>
                <div class="form-group"><label>内部评级</label><input type="text" id="fBankRating" placeholder="AAA/AA+"></div>
                <div class="form-group"><label>近期债券发行</label><input type="text" id="fRecentBond" placeholder="2024年公司债20亿元"></div>
                <div class="form-group"><label>最近到期项目</label><input type="text" id="fRecentMaturity" placeholder="2023年公司债15亿元 2024-12-20"></div>
                <div class="form-group"><label>预计发行规模</label><input type="text" id="fExpectedScale" placeholder="20亿元"></div>
                <div class="form-group"><label>额度情况</label><input type="text" id="fCreditLimit" placeholder="可用额度50亿元"></div>
                <div class="form-actions">
                    <button type="button" class="btn btn-outline" onclick="closeModal('projectModal')">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 模态框：详情 -->
    <div id="detailModal" class="modal-overlay">
        <div class="modal">
            <button class="close-btn" onclick="closeModal('detailModal')">&times;</button>
            <h2>项目详情</h2>
            <div id="detailContent"></div>
        </div>
    </div>

</div>

<script>
    // ================================================================
    // 配置 - 请修改为您的 Supabase 信息
    // ================================================================
    const SUPABASE_URL = 'https://dagdwpbevseqkozodfjl.supabase.co';   // 修改
    const SUPABASE_ANON_KEY = 'sb_publishable_nA2QCdW5HvCRBYvYVcg4jQ_Y0d6R_rB';                // 修改

    // ================================================================
    // 初始化 Supabase 客户端
    // ================================================================
    console.log('🔧 初始化 Supabase 客户端...');
    let supabase;
    try {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        console.log('✅ Supabase 客户端初始化成功');
    } catch (e) {
        alert('Supabase 初始化失败！请检查 URL 和 anon key。');
        console.error('❌ Supabase 初始化错误:', e);
    }

    let currentUser = null;
    let projects = [];

    // ================================================================
    // 辅助函数：显示错误（弹窗+日志）
    // ================================================================
    function showError(msg) {
        alert('❌ ' + msg);
        console.error('❌', msg);
    }

    function showInfo(msg) {
        console.log('ℹ️', msg);
    }

    // ================================================================
    // 认证模块
    // ================================================================
    async function initAuth() {
        showInfo('检查已有会话...');
        const { data, error } = await supabase.auth.getSession();
        if (error) {
            showError('获取会话失败: ' + error.message);
            return;
        }
        if (data.session) {
            currentUser = data.session.user;
            showInfo('已登录用户: ' + currentUser.email);
            showApp();
            await loadProjects();
        } else {
            showInfo('未登录，显示认证界面');
            showAuth();
        }
    }

    function showAuth() {
        document.getElementById('authCard').classList.remove('hidden');
        document.getElementById('appMain').classList.add('hidden');
    }

    function showApp() {
        document.getElementById('authCard').classList.add('hidden');
        document.getElementById('appMain').classList.remove('hidden');
        document.getElementById('userEmailDisplay').textContent = '👤 ' + currentUser.email;
    }

    // ---------- 登录 ----------
    document.getElementById('loginBtn').addEventListener('click', async function() {
        console.log('🔑 登录按钮被点击');
        const email = document.getElementById('emailInput').value.trim();
        const password = document.getElementById('passwordInput').value;
        const errEl = document.getElementById('authError');
        errEl.textContent = '';
        if (!email || !password) {
            errEl.textContent = '请输入邮箱和密码';
            return;
        }
        console.log('尝试登录:', email);
        try {
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                errEl.textContent = '登录失败: ' + error.message;
                showError('登录失败: ' + error.message);
                return;
            }
            currentUser = data.user;
            showInfo('登录成功: ' + currentUser.email);
            showApp();
            await loadProjects();
        } catch (e) {
            errEl.textContent = '登录异常: ' + e.message;
            showError('登录异常: ' + e.message);
        }
    });

    // ---------- 注册 ----------
    document.getElementById('registerBtn').addEventListener('click', async function() {
        console.log('📝 注册按钮被点击');
        const email = document.getElementById('emailInput').value.trim();
        const password = document.getElementById('passwordInput').value;
        const errEl = document.getElementById('authError');
        const sucEl = document.getElementById('authSuccess');
        errEl.textContent = '';
        sucEl.textContent = '';
        if (!email || !password) {
            errEl.textContent = '请输入邮箱和密码';
            return;
        }
        if (password.length < 6) {
            errEl.textContent = '密码至少6位';
            return;
        }
        console.log('尝试注册:', email);
        try {
            const { data, error } = await supabase.auth.signUp({ email, password });
            if (error) {
                errEl.textContent = '注册失败: ' + error.message;
                showError('注册失败: ' + error.message);
                return;
            }
            if (data.user) {
                currentUser = data.user;
                sucEl.textContent = '注册成功！已自动登录。';
                showInfo('注册成功并登录: ' + currentUser.email);
                showApp();
                await loadProjects();
            } else {
                // 可能因为邮箱验证未关闭，用户需要确认
                sucEl.textContent = '注册成功，但请检查邮箱确认（如果开启了邮箱验证）。';
                showInfo('注册成功但需要邮箱确认');
            }
        } catch (e) {
            errEl.textContent = '注册异常: ' + e.message;
            showError('注册异常: ' + e.message);
        }
    });

    // ---------- 登出 ----------
    document.getElementById('logoutBtn').addEventListener('click', async function() {
        console.log('🚪 登出');
        await supabase.auth.signOut();
        currentUser = null;
        projects = [];
        renderProjects();
        showAuth();
    });

    // ================================================================
    // 数据操作
    // ================================================================
    async function loadProjects() {
        if (!currentUser) return;
        console.log('加载项目数据...');
        try {
            const { data, error } = await supabase
                .from('projects')
                .select('*')
                .eq('user_id', currentUser.id);
            if (error) {
                showError('加载项目失败: ' + error.message);
                return;
            }
            projects = data.map(row => ({ id: row.id, ...row.data }));
            renderProjects();
        } catch (e) {
            showError('加载项目异常: ' + e.message);
        }
    }

    async function saveProjectToDB(projectData, id) {
        if (!currentUser) throw new Error('未登录');
        console.log('保存项目到数据库:', projectData.issuerName);
        if (id) {
            const { error } = await supabase
                .from('projects')
                .update({ data: projectData })
                .eq('id', id)
                .eq('user_id', currentUser.id);
            if (error) throw error;
        } else {
            const { error } = await supabase
                .from('projects')
                .insert([{ user_id: currentUser.id, data: projectData }]);
            if (error) throw error;
        }
        console.log('✅ 保存成功');
    }

    async function deleteProjectFromDB(id) {
        if (!currentUser) throw new Error('未登录');
        console.log('删除项目:', id);
        const { error } = await supabase
            .from('projects')
            .delete()
            .eq('id', id)
            .eq('user_id', currentUser.id);
        if (error) throw error;
        console.log('✅ 删除成功');
    }

    // ================================================================
    // 渲染
    // ================================================================
    function renderProjects() {
        const search = document.getElementById('searchInput').value.trim().toLowerCase();
        let filtered = projects.filter(p => p.issuerName && p.issuerName.toLowerCase().includes(search));
        const statusOrder = { 'marketing': 0, 'mandated': 1, 'completed': 2 };
        filtered.sort((a,b) => (statusOrder[a.status]||0) - (statusOrder[b.status]||0));

        const container = document.getElementById('projectsContainer');
        if (filtered.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#a0aec0; padding:30px;">暂无项目</p>';
        } else {
            container.innerHTML = filtered.map(p => `
                <div class="project-item" onclick="showDetail('${p.id}')">
                    <div>
                        <span style="font-weight:600;">${escHtml(p.issuerName)}</span>
                        <span class="status">${statusMap(p.status)}</span>
                        <span style="font-size:13px; color:#718096; margin-left:8px;">${escHtml(p.industry)||''}</span>
                    </div>
                    <div onclick="event.stopPropagation();">
                        <button class="btn btn-primary btn-sm" onclick="editProject('${p.id}')">编辑</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteProject('${p.id}')">删除</button>
                    </div>
                </div>
            `).join('');
        }
        updateStats();
    }

    function statusMap(s) {
        return { 'marketing':'营销中', 'mandated':'委任中', 'completed':'已完成' }[s] || s;
    }

    function escHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function updateStats() {
        const total = projects.length;
        const marketing = projects.filter(p => p.status === 'marketing').length;
        const mandated = projects.filter(p => p.status === 'mandated').length;
        const completed = projects.filter(p => p.status === 'completed').length;
        document.getElementById('totalCount').textContent = total;
        document.getElementById('marketingCount').textContent = marketing;
        document.getElementById('mandatedCount').textContent = mandated;
        document.getElementById('completedCount').textContent = completed;
    }

    // ================================================================
    // 详情
    // ================================================================
    function showDetail(id) {
        const p = projects.find(x => x.id === id);
        if (!p) return;
        const content = document.getElementById('detailContent');
        content.innerHTML = `
            <div><strong>发行人:</strong> ${escHtml(p.issuerName)}</div>
            <div><strong>状态:</strong> ${statusMap(p.status)}</div>
            <div><strong>行业:</strong> ${escHtml(p.industry)||'-'}</div>
            <div><strong>外部评级:</strong> ${escHtml(p.externalRating)||'-'}</div>
            <div><strong>内部评级:</strong> ${escHtml(p.bankInternalRating)||'-'}</div>
            <div><strong>近期发行:</strong> ${escHtml(p.recentBondIssuance)||'-'}</div>
            <div><strong>最近到期:</strong> ${escHtml(p.recentMaturityProject)||'-'}</div>
            <div><strong>预计规模:</strong> ${escHtml(p.expectedScale)||'-'}</div>
            <div><strong>额度:</strong> ${escHtml(p.creditLimit)||'-'}</div>
        `;
        openModal('detailModal');
    }

    // ================================================================
    // 新增/编辑/删除
    // ================================================================
    function openAddModal() {
        document.getElementById('modalTitle').textContent = '新增项目';
        document.getElementById('editId').value = '';
        document.getElementById('projectForm').reset();
        document.getElementById('fStatus').value = 'marketing';
        openModal('projectModal');
    }

    function editProject(id) {
        const p = projects.find(x => x.id === id);
        if (!p) return;
        document.getElementById('modalTitle').textContent = '编辑项目';
        document.getElementById('editId').value = id;
        document.getElementById('fStatus').value = p.status || 'marketing';
        document.getElementById('fIssuerName').value = p.issuerName || '';
        document.getElementById('fIndustry').value = p.industry || '其他';
        document.getElementById('fExternalRating').value = p.externalRating || '';
        document.getElementById('fBankRating').value = p.bankInternalRating || '';
        document.getElementById('fRecentBond').value = p.recentBondIssuance || '';
        document.getElementById('fRecentMaturity').value = p.recentMaturityProject || '';
        document.getElementById('fExpectedScale').value = p.expectedScale || '';
        document.getElementById('fCreditLimit').value = p.creditLimit || '';
        openModal('projectModal');
    }

    function saveProject(e) {
        e.preventDefault();
        try {
            const id = document.getElementById('editId').value;
            const data = {
                issuerName: document.getElementById('fIssuerName').value.trim(),
                status: document.getElementById('fStatus').value,
                industry: document.getElementById('fIndustry').value,
                externalRating: document.getElementById('fExternalRating').value.trim(),
                bankInternalRating: document.getElementById('fBankRating').value.trim(),
                recentBondIssuance: document.getElementById('fRecentBond').value.trim(),
                recentMaturityProject: document.getElementById('fRecentMaturity').value.trim(),
                expectedScale: document.getElementById('fExpectedScale').value.trim(),
                creditLimit: document.getElementById('fCreditLimit').value.trim(),
            };
            if (!data.issuerName) { alert('请输入发行人名称'); return; }
            // 保留已有字段（如投资意向等）
            if (id) {
                const old = projects.find(p => p.id === id);
                if (old) {
                    // 合并 old 中可能存在的其他字段（如 investmentIntents）
                    Object.keys(old).forEach(k => {
                        if (!(k in data) && k !== 'id' && k !== 'user_id') {
                            data[k] = old[k];
                        }
                    });
                }
            }
            saveProjectToDB(data, id).then(() => {
                closeModal('projectModal');
                loadProjects();
            }).catch(err => {
                alert('保存失败: ' + err.message);
                console.error(err);
            });
        } catch (err) {
            alert('保存失败: ' + err.message);
            console.error(err);
        }
    }

    function deleteProject(id) {
        if (!confirm('确定删除此项目吗？')) return;
        deleteProjectFromDB(id).then(() => {
            loadProjects();
        }).catch(err => {
            alert('删除失败: ' + err.message);
            console.error(err);
        });
    }

    // ================================================================
    // 导入/导出
    // ================================================================
    function exportData() {
        const blob = new Blob([JSON.stringify(projects, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'deal-tracker-backup.json';
        a.click();
        URL.revokeObjectURL(url);
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (Array.isArray(data)) {
                    if (confirm('将覆盖当前所有数据，确定继续吗？')) {
                        const promises = data.map(p => saveProjectToDB(p, p.id || null));
                        Promise.all(promises).then(() => {
                            loadProjects();
                            alert('导入成功！');
                        }).catch(err => {
                            alert('导入失败: ' + err.message);
                            console.error(err);
                        });
                    }
                } else {
                    alert('无效的数据格式');
                }
            } catch (err) {
                alert('解析文件失败: ' + err.message);
                console.error(err);
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    // ================================================================
    // 模态框控制
    // ================================================================
    function openModal(id) {
        document.getElementById(id).classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('active');
        document.body.style.overflow = '';
    }

    // 点击遮罩关闭
    document.querySelectorAll('.modal-overlay').forEach(el => {
        el.addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.remove('active');
                document.body.style.overflow = '';
            }
        });
    });

    // ================================================================
    // 初始化
    // ================================================================
    window.onload = function() {
        console.log('🚀 页面加载完成，开始初始化...');
        initAuth().catch(e => {
            alert('初始化失败: ' + e.message);
            console.error(e);
        });
    };

    // 暴露全局函数
    window.openAddModal = openAddModal;
    window.editProject = editProject;
    window.deleteProject = deleteProject;
    window.showDetail = showDetail;
    window.renderProjects = renderProjects;
    window.exportData = exportData;
    window.importData = importData;
    window.closeModal = closeModal;
