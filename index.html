<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deal Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Deal Tracker</h1>
    <div>
        <input type="email" id="email" placeholder="邮箱">
        <input type="password" id="password" placeholder="密码">
        <button id="loginBtn">登录</button>
        <button id="registerBtn">注册</button>
        <div id="message"></div>
    </div>

    <script>
        // 只声明一次
        const SUPABASE_URL = 'https://dagdwpbevseqkozodfjl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_nA2QCdW5HvCRBYvYVcg4jQ_Y0d6R_rB';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            document.getElementById('message').innerText = error ? '登录失败: ' + error.message : '登录成功！用户: ' + data.user.email;
        });

        document.getElementById('registerBtn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { data, error } = await supabase.auth.signUp({ email, password });
            document.getElementById('message').innerText = error ? '注册失败: ' + error.message : '注册成功！用户: ' + (data.user ? data.user.email : '请确认邮箱');
        });
    </script>
</body>
</html>
