<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deal Tracker - 云端版</title>
    <!-- 引入 Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* 此处省略原有样式，与之前完全相同，为了节省篇幅，但实际需包含完整样式 */
        /* 您可以复制之前版本的完整样式，或者直接使用下方简化样式，但为了保证效果，建议使用之前版本的完整样式 */
        /* 由于篇幅，我们暂时保留最简单样式，但您可以从之前回复中获取完整样式 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #f0f4f8; padding: 20px; }
        .app-container { max-width: 1200px; margin: 0 auto; }
        /* ... 其余样式请从之前的回答中复制 ... */
    </style>
</head>
<body>
    <div class="app-container">
        <h1>📊 Deal Tracker <small>云端版</small></h1>
        <div>
            <button onclick="login()">登录</button>
            <button onclick="logout()">登出</button>
            <span id="userStatus">未登录</span>
        </div>
        <hr>
        <button onclick="addProject()">新增项目</button>
        <div id="projectList"></div>
    </div>

    <script>
        // ============================================================
        // 配置：请替换为您的极空间 Supabase 信息
        // ============================================================
        const SUPABASE_URL = 'http://你的极空间IP:8000';   // 修改这里
        const SUPABASE_ANON_KEY = '你的anon密钥';          // 修改这里

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUser = null;

        // ============================================================
        // 用户认证
        // ============================================================
        async function login() {
            const email = prompt('请输入邮箱');
            const password = prompt('请输入密码');
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                // 如果用户不存在，尝试注册
                const { data: signUpData, error: signUpError } = await supabase.auth.signUp({ email, password });
                if (signUpError) { alert('登录/注册失败：' + signUpError.message); return; }
                alert('注册成功，请再次登录');
                return;
            }
            currentUser = data.user;
            document.getElementById('userStatus').textContent = '已登录: ' + currentUser.email;
            loadProjects();
        }

        async function logout() {
            await supabase.auth.signOut();
            currentUser = null;
            document.getElementById('userStatus').textContent = '未登录';
            document.getElementById('projectList').innerHTML = '';
        }

        // ============================================================
        // 数据操作
        // ============================================================
        async function loadProjects() {
            if (!currentUser) return;
            const { data, error } = await supabase
                .from('projects')
                .select('*')
                .eq('user_id', currentUser.id);
            if (error) { alert('加载失败：' + error.message); return; }
            renderProjects(data);
        }

        function renderProjects(projects) {
            const container = document.getElementById('projectList');
            container.innerHTML = projects.map(p => `
                <div style="border:1px solid #ccc; margin:8px; padding:12px; border-radius:8px;">
                    <strong>${p.data.issuerName || '未命名'}</strong>
                    <span style="margin-left:16px;">${p.data.status || '营销中'}</span>
                    <button onclick="deleteProject('${p.id}')">删除</button>
                    <button onclick="editProject('${p.id}')">编辑</button>
                </div>
            `).join('');
        }

        async function addProject() {
            if (!currentUser) { alert('请先登录'); return; }
            const name = prompt('请输入发行人名称');
            if (!name) return;
            const newProject = {
                issuerName: name,
                status: 'marketing',
                // 其他字段可后续完善
            };
            const { data, error } = await supabase
                .from('projects')
                .insert([{ user_id: currentUser.id, data: newProject }]);
            if (error) { alert('添加失败：' + error.message); return; }
            loadProjects();
        }

        async function deleteProject(id) {
            if (!confirm('确定删除吗？')) return;
            const { error } = await supabase
                .from('projects')
                .delete()
                .eq('id', id);
            if (error) { alert('删除失败：' + error.message); return; }
            loadProjects();
        }

        async function editProject(id) {
            // 简单编辑演示：修改状态
            const newStatus = prompt('输入新状态（marketing/mandated/completed）', 'marketing');
            if (!newStatus) return;
            // 先从数据库获取当前项目数据
            const { data, error } = await supabase
                .from('projects')
                .select('data')
                .eq('id', id)
                .single();
            if (error) { alert('获取失败：' + error.message); return; }
            const projectData = data.data;
            projectData.status = newStatus;
            const { error: updateError } = await supabase
                .from('projects')
                .update({ data: projectData })
                .eq('id', id);
            if (updateError) { alert('更新失败：' + updateError.message); return; }
            loadProjects();
        }

        // 页面加载时检查是否已登录
        window.onload = async function() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                currentUser = session.user;
                document.getElementById('userStatus').textContent = '已登录: ' + currentUser.email;
                loadProjects();
            }
        };
    </script>
</body>
</html>
